name: Mirror baseline from source ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mirror:
    if: ${{ !contains(github.event.head_commit.message, '[mirror-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild baseline mirror from source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP='H3NSFW提示词技能skill第三版-V1-5-patch-optimize.zip'
          DEST='baseline/H3NSFW提示词技能skill第三版-V1-5-patch-optimize'
          TMP='_baseline_extract'

          rm -rf "$TMP" "$DEST"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          mkdir -p "$DEST"
          cp -a "$TMP/h3-nsfw-director/." "$DEST/"
          rm -f baseline/.gitkeep
          rm -rf "$TMP"

      - name: Commit mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A baseline
          if git diff --cached --quiet; then
            echo 'Baseline already matches source ZIP.'
            exit 0
          fi
          git commit -m 'Mirror baseline from source ZIP [mirror-bot]'
          git push

# trigger mirror after source workflow installation
